title: No PDF Fragments
author: Claude Haiku
version: 0.1.0
description: |
  Prevent fragment elements from appearing in PDF exports of Reveal.js presentations.
  Add the class `no-pdf-fragment` to any fragment to exclude it from PDF output.

contributes:
  revealjs-plugins:
    - name: RevealNoPdfFragment
      script:
        - no-pdf-fragment.js
